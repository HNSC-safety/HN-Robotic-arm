# ======================================================================
# 【测试专用配置】—— 只放一行，其余全部沿用 src/main/resources
# ======================================================================
#
# ⚠️ 为什么本文件只有一行？
#
#    因为测试跑在 `target/test-classes` 优先的 classpath 上，
#    而 `src/main/resources/application.yaml` 里的东西**照样会加载**
#    （端口、暗号、ICE 参数全都继承）。
#
#    所以本文件只回答一个问题：**测试默认激活哪个 profile**。
#
# ──────────────────────────────────────────────────────────────────────
# ⚠️ 现在的测试**不靠 profile 决定连谁** —— 靠测试方法上的 `real` 参数：
#
#    @ParameterizedTest
#    @ValueSource(booleans = {false, true})
#    void shouldMoveArmFromTopToBottom(boolean real) { ... }
#
#    real=false → 内置假算法端（离线，通）
#    real=true  → 真实 C# 算法端（192.168.0.103，算法端没开就如实失败）
#
#    所以 profile 只影响"不传参数时默认连谁"，对测试用例没有影响。
#
# ──────────────────────────────────────────────────────────────────────
# 想在 IntelliJ 里打【真实算法端】？两种方式，任选其一：
#
#   ① Run/Debug Configuration → VM options 加一行：
#          -Dspring.profiles.active=real
#      （system property 优先级高于本文件，它说了算）
#
#   ② Run/Debug Configuration → Active profiles 填 real
#
# ──────────────────────────────────────────────────────────────────────
# 命令行跑真机：
#
#    mvn test -Dspring.profiles.active=real
#
# ⚠️ 注意：命令行 -D 是 system property，优先级比本文件高，
#    所以 `mvn test -Dspring.profiles.active=real` 能正确切到真机。
#
spring.profiles.active=mock
